      return (
        <div className="space-y-4 animate-screen">
          
          <div className="bg-gradient-to-br from-brandNavy via-slate-900 to-blue-900 p-6 rounded-3xl text-white shadow-floating space-y-1 relative overflow-hidden stagger-1">
            <div className="absolute -right-8 -top-8 w-32 h-32 rounded-full bg-blue-500/15 pointer-events-none"></div>
            <span className="text-xs font-display font-bold uppercase tracking-[0.06em] text-blue-300">SwiftPark Wallet</span>
            <div className="font-display text-[32px] leading-[36px] font-extrabold tracking-tight tabular-nums mt-1">
              ₹{animatedBalance}.00
            </div>
            <p className="text-sm text-slate-300 pt-1">Automated credits for releases, waivers, and resolutions</p>
          </div>

          <div className="bg-white rounded-3xl border border-borderSubtle p-5 shadow-raised space-y-3.5 stagger-2">
            <SectionHeader icon={<Icon.Wallet />} title="Transaction History" />

            <div className="space-y-2.5">
              {state.walletLedger.map(item => {
                const isCredit = item.type === 'credit';
                return (
                  <div key={item.id} className="p-3.5 bg-slate-50 rounded-2xl border border-slate-100 flex items-center justify-between gap-3 text-sm">
                    <div className="flex items-center gap-3 min-w-0">
                      <div className={`w-9 h-9 rounded-full flex items-center justify-center shrink-0 ${
                        isCredit ? 'bg-emerald-100 text-emerald-700' : 'bg-slate-200 text-slate-700'
                      }`}>
                        <div className="w-4 h-4">
                          {isCredit ? <Icon.ArrowDownLeft /> : <Icon.ArrowUpRight />}
                        </div>
                      </div>
                      <div className="min-w-0">
                        <div className="font-semibold text-slate-800 truncate">{item.title}</div>
                        <div className="text-xs text-slate-500 mt-0.5">{item.time}</div>
                      </div>
                    </div>
                    <span className={`font-display font-bold text-sm tabular-nums shrink-0 ${isCredit ? 'text-emerald-600' : 'text-slate-800'}`}>
                      {isCredit ? `+₹${item.amount}` : `-₹${item.amount}`}
                    </span>
                  </div>
                );
              })}
            </div>
          </div>

        </div>
      );
    }

    // =========================================================================
    // DRIVER MODAL & BOTTOM SHEETS (B5 3-STEP SEARCH SEQUENCE)
    // =========================================================================
    function DriverModalManager({ state, dispatch }) {
      const { activeModal, lookupStep, booking } = state;
      const [localPlate, setLocalPlate] = useState(booking.enteredPlate || '4021');

      if (!activeModal) return null;

      const lookupMessages = [
        'Checking nearby availability...',
        'Verifying sensor signal...',
        'Securing your alternative...'
      ];

      return (
        <div className="absolute inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-end justify-center">
          <div className="w-full bg-white rounded-t-3xl border-t border-borderSubtle p-6 shadow-floating animate-sheet space-y-4">
            <div className="w-10 h-1 bg-slate-300 rounded-full mx-auto"></div>

            {/* MODAL: CANCEL ACTIVE PASS */}
            {activeModal === 'cancel_pass' && (
              <div className="space-y-4 text-center">
                <div className="w-12 h-12 rounded-full bg-slate-100 text-slate-700 flex items-center justify-center mx-auto">
                  <div className="w-6 h-6"><Icon.Info /></div>
                </div>
                <div>
                  <h3 className="font-display text-lg font-bold text-brandNavy">Cancel Parking Pass?</h3>
                  <p className="text-[15px] leading-[22px] text-inkMuted mt-1 px-2">
                    {booking.firstNoShowEligible ? (
                      <>Cancelling after booking start releases Bay B-08 immediately. Because this is your first no-show, the fee is waived: <strong>₹120 returns directly to your wallet</strong>.</>
                    ) : (
                      <>Cancelling releases Bay B-08 immediately. Standard 25% fee applies: <strong>₹90 returns to your wallet</strong> (₹30 fee retained).</>
                    )}
                  </p>
                </div>

                <div className="flex gap-2.5 pt-2">
                  <div className="flex-1">
                    <Btn variant="secondary" className="h-14" onClick={() => dispatch({ type: 'CLOSE_MODAL' })}>
                      Keep Booking
                    </Btn>
                  </div>
                  <div className="flex-1">
                    <Btn variant="destructiveSolid" onClick={() => dispatch({ type: 'TRIGGER_RELEASE', reason: 'user_cancel' })}>
                      Confirm & Release
                    </Btn>
                  </div>
                </div>
              </div>
            )}

            {/* B5: S5 CONFLICT REPORT SHEET WITH VERTICAL 3-STEP PROGRESS */}
            {activeModal === 'conflict_sheet' && (
              <div className="space-y-4">
                <div className="text-center">
                  <h3 className="font-display text-lg font-bold text-brandNavy">Someone is in your spot?</h3>
                  <p className="text-sm text-inkMuted mt-0.5">Outcome in under 90 seconds: verified spot or instant refund.</p>
                </div>

                {lookupStep > 0 ? (
                  <div className="py-3 space-y-4">
                    {/* Small Radar */}
                    <div className="relative w-14 h-14 mx-auto rounded-full bg-slate-900 flex items-center justify-center border border-slate-700 overflow-hidden shadow-subtle">
                      <div className="w-full h-full absolute inset-0 bg-gradient-to-tr from-transparent via-blue-500/40 to-transparent animate-radar"></div>
                      <div className="w-2.5 h-2.5 rounded-full bg-blue-400"></div>
                    </div>

                    {/* Vertical 3-Step Sequence */}
                    <div className="bg-slate-50 rounded-2xl border border-slate-200 p-4 space-y-3">
                      {lookupMessages.map((msg, idx) => {
                        const stepNum = idx + 1;
                        const isDone = lookupStep > stepNum;
                        const isCurrent = lookupStep === stepNum;
                        return (
                          <div key={msg} className="flex items-center gap-3 text-sm">
                            {isDone ? (
                              <div className="w-6 h-6 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center p-1 shrink-0">
                                <Icon.Check />
                              </div>
                            ) : isCurrent ? (
                              <div className="w-6 h-6 rounded-full bg-blue-100 text-brandBlue flex items-center justify-center p-1 shrink-0">
                                <Icon.Spinner />
                              </div>
                            ) : (
                              <div className="w-6 h-6 rounded-full bg-slate-200 text-slate-400 flex items-center justify-center text-xs font-bold shrink-0 tabular-nums">
                                {stepNum}
                              </div>
                            )}
                            <span className={`${
                              isDone ? 'text-slate-700 font-semibold' :
                              isCurrent ? 'text-brandNavy font-display font-bold' :
                              'text-slate-400 font-medium'
                            }`}>
                              {msg}
                            </span>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                ) : (
                  <>
                    <div className="space-y-1.5 text-left">
                      <label htmlFor="plate-digits-input" className="text-sm font-semibold text-slate-700 block">
                        Vehicle plate (last 4 digits, optional):
                      </label>
                      <input
                        id="plate-digits-input"
                        type="text"
                        inputMode="numeric"
                        maxLength="4"
                        value={localPlate}
                        onChange={(e) => setLocalPlate(e.target.value)}
                        placeholder="4021"
                        className="w-full bg-slate-50 border border-borderSubtle rounded-2xl px-4 py-3 text-base font-display font-bold text-slate-900 tabular-nums focus:outline-none focus:ring-2 focus:ring-brandBlue"
                      />
                    </div>

                    <div className="flex gap-2.5 pt-2">
                      <div className="flex-1">
                        <Btn variant="secondary" className="h-14" onClick={() => dispatch({ type: 'CLOSE_MODAL' })}>
                          Cancel
                        </Btn>
                      </div>
                      <div className="flex-[2]">
                        <Btn
                          variant="primary"
                          onClick={() => dispatch({ type: 'STEP_LOOKUP', step: 1, plate: localPlate })}
                          trailingIcon={<Icon.ArrowRight />}
                        >
                          Find me a verified spot
                        </Btn>
                      </div>
                    </div>
                  </>
                )}
              </div>
            )}

            {/* MODAL: CONFIRM SWITCH ZONE */}
            {activeModal === 'switch_zone' && (
              <div className="space-y-4 text-center">
                <h3 className="font-display text-lg font-bold text-brandNavy">Transfer to Brigade Road?</h3>
                <p className="text-[15px] leading-[22px] text-inkMuted px-2">
                  Bay A-04 at Brigade Road Zone (400 m away) will be secured for your vehicle without any additional charge.
                </p>
                <div className="flex gap-2.5 pt-2">
                  <div className="flex-1">
                    <Btn variant="secondary" className="h-14" onClick={() => dispatch({ type: 'CLOSE_MODAL' })}>Back</Btn>
                  </div>
                  <div className="flex-1">
                    <Btn variant="navy" onClick={() => dispatch({ type: 'TRANSFER_BRIGADE_ZONE' })}>Confirm Transfer</Btn>
                  </div>
                </div>
              </div>
            )}

            {/* MODAL: CONFIRM REFUND */}
            {activeModal === 'refund_flow' && (
              <div className="space-y-4 text-center">
                <h3 className="font-display text-lg font-bold text-brandNavy">Instant Resolution Refund</h3>
                
                <div className="bg-slate-50 p-4 rounded-2xl border border-slate-200 text-sm text-left space-y-2">
                  <div className="flex justify-between">
                    <span className="text-slate-600">Booking pass refund:</span>
                    <span className="font-bold text-slate-900 tabular-nums">₹120</span>
                  </div>
                  <div className="flex justify-between text-emerald-700 font-semibold">
                    <span>Inconvenience apology credit:</span>
                    <span className="font-bold tabular-nums">+₹50</span>
                  </div>
                  <div className="pt-2 border-t border-slate-200 flex justify-between font-display font-extrabold text-slate-900">
                    <span>Total credited:</span>
                    <span className="text-emerald-600 tabular-nums">₹170</span>
                  </div>
                </div>

                <p className="text-sm text-slate-500">Available immediately in your SwiftPark wallet.</p>

                <div className="flex gap-2.5 pt-1">
                  <div className="flex-1">
                    <Btn variant="secondary" className="h-14" onClick={() => dispatch({ type: 'CLOSE_MODAL' })}>Back</Btn>
                  </div>
                  <div className="flex-1">
                    <Btn variant="success" onClick={() => dispatch({ type: 'PROCESS_FULL_REFUND' })}>Credit ₹170 Now</Btn>
                  </div>
                </div>
              </div>
            )}

          </div>
        </div>
      );
    }

    // =========================================================================
    // WARDEN APP VIEW ("SWIFTPARK ENFORCE" - B9 UPGRADES)
    // =========================================================================
    function WardenAppView({ state, dispatch }) {
      const { wardenTab, wardenTasks, bays, toasts } = state;
      const [nowTick, setNowTick] = useState(Date.now());
      const wardenToast = toasts.warden;

      useEffect(() => {
        const timer = setInterval(() => setNowTick(Date.now()), 1000);
        return () => clearInterval(timer);
      }, []);

      const formatRelativeTime = (timestamp) => {
        const sec = Math.max(0, Math.floor((nowTick - timestamp) / 1000));
        if (sec < 5) return 'Just now';
        if (sec < 60) return `${sec}s ago`;
        const min = Math.floor(sec / 60);
        return `${min}m ago`;
      };

      const pendingTasks = wardenTasks.filter(t => t.status === 'pending');
      const resolvedTasks = wardenTasks.filter(t => t.status === 'resolved');

      const avgResponseFormatted = state.resolvedTasksCount > 0
        ? `${Math.round(state.totalResponseTimeSec / state.resolvedTasksCount)}s`
        : '0s';

      const freeBays = bays.filter(b => b.status === 'available').length;
      const occupiedBays = bays.filter(b => b.status === 'occupied' || b.status === 'occupied_by_squatter').length;
      const ghostBays = bays.filter(b => b.status === 'ghost').length;

      return (
        <div className="flex-1 flex flex-col bg-wardenBg text-slate-100 overflow-hidden relative font-sans">
          
          {/* Warden Toast Banner */}
          {wardenToast && (
            <div key={wardenToast.id} className="absolute top-3 inset-x-4 z-50 animate-toast pointer-events-auto">
              <div className="px-4 py-3 rounded-2xl shadow-floating border border-wardenAmber bg-amber-950/95 text-amber-100 flex items-center gap-2.5 text-xs font-semibold backdrop-blur-md">
                <div className="w-4 h-4 text-wardenAmber shrink-0"><Icon.AlertTriangle /></div>
                <span className="flex-1 leading-snug">{wardenToast.message}</span>
              </div>
            </div>
          )}

          {/* Warden Header */}
          <header className="px-5 py-3.5 bg-wardenSurface border-b border-slate-800 flex items-center justify-between shrink-0">
            <div className="flex items-center gap-2.5">
              <div className="w-8 h-8 rounded-xl bg-amber-500/20 text-wardenAmber border border-amber-500/30 flex items-center justify-center p-1.5">
                <Icon.Shield />
              </div>
              <div>
                <h2 className="font-display text-xs font-extrabold tracking-[0.06em] uppercase text-wardenAmber">SwiftPark Enforce</h2>
                <div className="text-xs text-slate-400 font-medium">MG Road Zone (20 Bays)</div>
              </div>
            </div>

            <div className="bg-slate-800 text-slate-200 text-xs font-display font-bold px-3 py-1 rounded-full border border-slate-700 tabular-nums">
              {pendingTasks.length} Pending
            </div>
          </header>

          {/* Summary Tiles */}
          {wardenTab === 'tasks' && (
            <div className="grid grid-cols-3 gap-2 px-5 pt-3.5 pb-1 shrink-0">
              <div className="bg-wardenSurface p-2.5 rounded-2xl border border-slate-800 text-center">
                <span className="text-xs font-display font-bold text-slate-400 uppercase tracking-[0.06em] block">Open</span>
                <span className="font-display text-lg font-extrabold text-wardenAmber tabular-nums">{pendingTasks.length}</span>
              </div>
              <div className="bg-wardenSurface p-2.5 rounded-2xl border border-slate-800 text-center">
                <span className="text-xs font-display font-bold text-slate-400 uppercase tracking-[0.06em] block">Resolved</span>
                <span className="font-display text-lg font-extrabold text-emerald-400 tabular-nums">{resolvedTasks.length}</span>
              </div>
              <div className="bg-wardenSurface p-2.5 rounded-2xl border border-slate-800 text-center">
                <span className="text-xs font-display font-bold text-slate-400 uppercase tracking-[0.06em] block">Avg Resp</span>
                <span className="font-display text-lg font-extrabold text-slate-200 tabular-nums">{avgResponseFormatted}</span>
              </div>
            </div>
          )}

          {/* Main Operational Body */}
          <main className="flex-1 overflow-y-auto custom-scroll p-5 space-y-4">
            
            {wardenTab === 'tasks' ? (
              <div className="space-y-3.5 animate-screen">
                <SectionHeader
                  dark={true}
                  icon={<Icon.Shield />}
                  title={`Actionable Conflict Tasks (${wardenTasks.length})`}
                />

                {wardenTasks.length === 0 ? (
                  <div className="bg-wardenSurface border border-slate-800 rounded-3xl p-8 text-center text-sm text-slate-400 space-y-2">
                    <div className="w-10 h-10 rounded-full bg-slate-800 text-wardenAmber flex items-center justify-center mx-auto p-2">
                      <Icon.Shield />
                    </div>
                    <div className="font-display font-bold text-slate-200 text-base">No open squatter disputes</div>
                    <p>Unclaimed reservations auto-release. You will be alerted here when a bay conflict occurs.</p>
                  </div>
                ) : (
                  <div className="space-y-3">
                    {wardenTasks.map(task => (
                      <div key={task.id} className="bg-wardenSurface border border-slate-800 rounded-3xl p-5 shadow-raised space-y-3 relative overflow-hidden">
                        
                        <div className={`absolute top-0 bottom-0 left-0 w-1.5 ${task.status === 'pending' ? 'bg-rose-500' : 'bg-emerald-500'}`}></div>

                        <div className="flex justify-between items-start pl-2">
                          <div>
                            <div className="flex items-center gap-2">
                              {task.status === 'pending' && (
                                <span className="w-2.5 h-2.5 rounded-full bg-rose-500 animate-pulse"></span>
                              )}
                              <h4 className="font-display text-base font-extrabold text-white">Bay {task.bay}</h4>
                            </div>
                            <p className="text-sm text-rose-300 font-semibold mt-0.5 tabular-nums">
                              Unauthorized vehicle ...{task.plate}
                            </p>
                          </div>
                          <span className="text-xs text-slate-300 bg-slate-900 px-2.5 py-1 rounded-lg border border-slate-800 tabular-nums font-medium">
                            {formatRelativeTime(task.timestamp)}
                          </span>
                        </div>

                        {/* B9: outcomeDetail with small icon */}
                        <div className="pl-2 flex items-center gap-2 text-sm text-slate-300 font-medium">
                          <div className="w-4 h-4 text-blue-400 shrink-0"><Icon.Navigation /></div>
                          <span>{task.outcomeDetail}</span>
                        </div>

                        {task.status === 'pending' ? (
                          <div className="pt-2 pl-2 border-t border-slate-800 grid grid-cols-3 gap-2">
                            <button
                              type="button"
                              onClick={() => dispatch({
                                type: 'WARDEN_ACTION',
                                taskId: task.id,
                                taskTimestamp: task.timestamp,
                                label: 'Acknowledged'
                              })}
                              className="h-12 bg-slate-800 hover:bg-slate-700 text-slate-100 text-xs font-display font-bold rounded-xl border border-slate-700 tap-scale flex items-center justify-center gap-1.5 px-2"
                            >
                              <div className="w-4 h-4 shrink-0"><Icon.Check /></div>
                              <span>Ack</span>
                            </button>
                            <button
                              type="button"
                              onClick={() => dispatch({
                                type: 'WARDEN_ACTION',
                                taskId: task.id,
                                taskTimestamp: task.timestamp,
                                label: 'Ticket Issued (₹500)'
                              })}
                              className="h-12 bg-rose-950/90 hover:bg-rose-900 text-rose-100 text-xs font-display font-bold rounded-xl border border-rose-800 tap-scale flex items-center justify-center gap-1.5 px-2"
                            >
                              <div className="w-4 h-4 shrink-0"><Icon.Ticket /></div>
                              <span>Ticket</span>
                            </button>
                            <button
                              type="button"
                              onClick={() => dispatch({
                                type: 'WARDEN_ACTION',
                                taskId: task.id,
                                taskTimestamp: task.timestamp,
                                label: 'Booking Verified'
                              })}
                              className="h-12 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-display font-semibold rounded-xl border border-slate-700 tap-scale flex items-center justify-center gap-1.5 px-2"
                            >
                              <div className="w-4 h-4 shrink-0"><Icon.Info /></div>
                              <span>Valid</span>
                            </button>
                          </div>
                        ) : (
                          <div className="pl-2 pt-1 text-sm text-emerald-400 font-bold flex items-center gap-2 tabular-nums">
                            <div className="w-4 h-4 shrink-0"><Icon.Check /></div>
                            <span>Resolved: {task.resolutionText}</span>
                          </div>
                        )}

                      </div>
                    ))}
                  </div>
                )}
              </div>
            ) : (
              /* B9: ZONE MATRIX TAB WITH >=64px TILES */
              <div className="space-y-3.5 animate-screen">
                <div className="flex flex-wrap items-center justify-between gap-2">
                  <SectionHeader dark={true} icon={<Icon.Pin />} title="Real-Time Bay Matrix" />
                  <div className="flex items-center gap-1.5 text-xs font-semibold tabular-nums">
                    <span className="px-2 py-0.5 rounded-full bg-emerald-950 border border-emerald-700 text-emerald-300">{freeBays} Free</span>
                    <span className="px-2 py-0.5 rounded-full bg-slate-800 border border-slate-700 text-slate-300">{occupiedBays} Taken</span>
                    <span className="px-2 py-0.5 rounded-full bg-amber-950 border border-amber-700 text-amber-300">{ghostBays} Ghost</span>
                  </div>
                </div>

                <div className="grid grid-cols-4 gap-2">
                  {bays.map(bay => {
                    let tileStyle = 'bg-slate-900 border-slate-800 text-slate-400';
                    let statusText = 'Taken';
                    let statusIcon = <div className="w-4 h-4"><Icon.CarTop /></div>;

                    if (bay.status === 'available') {
                      tileStyle = 'bg-emerald-950/70 border-emerald-600 text-emerald-300';
                      statusText = 'Free';
                      statusIcon = <span className="font-display font-extrabold text-xs">P</span>;
                    } else if (bay.status === 'ghost') {
                      tileStyle = 'bg-amber-950/70 border-amber-600 text-amber-300';
                      statusText = 'Ghost';
                      statusIcon = <div className="w-4 h-4"><Icon.Hourglass /></div>;
                    } else if (bay.status === 'occupied_by_squatter') {
                      tileStyle = 'bg-rose-950 border-rose-500 text-rose-200 font-bold';
                      statusText = 'Squatter';
                      statusIcon = <div className="w-4 h-4 text-rose-400"><Icon.AlertTriangle /></div>;
                    } else if (bay.status === 'reserved_unclaimed' || bay.status === 'reserved_checked_in') {
                      tileStyle = 'bg-blue-950 border-blue-500 text-blue-200';
                      statusText = 'Booked';
                      statusIcon = <div className="w-4 h-4"><Icon.Clock /></div>;
                    }

                    return (
                      <div
                        key={bay.id}
                        className={`min-h-[68px] p-2.5 rounded-2xl border flex flex-col items-center justify-between gap-1 text-center ${tileStyle}`}
                      >
                        <div className="font-display text-xs font-bold tabular-nums">{bay.id}</div>
                        <div className="my-0.5">{statusIcon}</div>
                        <div className="text-xs font-medium tracking-tight truncate w-full">{statusText}</div>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

          </main>

          {/* Warden Bottom Bar */}
          <nav
            style={{ paddingBottom: 'env(safe-area-inset-bottom, 8px)' }}
            className="shrink-0 bg-wardenSurface border-t border-slate-800 flex items-center justify-around px-3 pt-2 pb-2 z-30"
          >
            <button
              type="button"
              onClick={() => dispatch({ type: 'SET_WARDEN_TAB', tab: 'tasks' })}
              className={`flex-1 min-h-[48px] flex flex-col items-center justify-center gap-1 font-bold text-xs focus:outline-none ${
                wardenTab === 'tasks' ? 'text-wardenAmber' : 'text-slate-400'
              }`}
            >
              <div className={`px-4 py-1 rounded-full relative ${wardenTab === 'tasks' ? 'bg-amber-500/15 text-wardenAmber' : ''}`}>
                <div className="w-5 h-5"><Icon.Shield /></div>
                {pendingTasks.length > 0 && (
                  <span className="absolute top-0.5 right-2.5 w-2.5 h-2.5 rounded-full bg-rose-500 border-2 border-wardenSurface"></span>
                )}
              </div>
              <span>Open Tasks</span>
            </button>
            <button
              type="button"
              onClick={() => dispatch({ type: 'SET_WARDEN_TAB', tab: 'zone' })}
              className={`flex-1 min-h-[48px] flex flex-col items-center justify-center gap-1 font-bold text-xs focus:outline-none ${
                wardenTab === 'zone' ? 'text-wardenAmber' : 'text-slate-400'
              }`}
            >
              <div className={`px-4 py-1 rounded-full ${wardenTab === 'zone' ? 'bg-amber-500/15 text-wardenAmber' : ''}`}>
                <div className="w-5 h-5"><Icon.Pin /></div>
              </div>
              <span>Zone Matrix</span>
            </button>
          </nav>

        </div>
      );
    }

    // Mount Application
    const rootEl = document.getElementById('root');
    const root = ReactDOM.createRoot(rootEl);
    root.render(<SwiftParkMain />);
  </script>
</body>
</html>
