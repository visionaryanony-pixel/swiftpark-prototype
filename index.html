<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0F1D32" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>SwiftPark - Smart City Parking</title>

  <!-- Google Fonts: Plus Jakarta Sans (600, 700, 800) & Inter (400, 500, 600, 700) -->

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />

  <!-- Pinned UMD React 18.2.0, ReactDOM 18.2.0, Babel Standalone 7.24.0, Tailwind CDN 3.4.1 -->
  <script src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.24.0/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com/3.4.1"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
            display: ['"Plus Jakarta Sans"', 'Inter', 'sans-serif'],
          },
          colors: {
            brandNavy: '#0F1D32',
            brandBlue: '#2563EB',
            brandEmerald: '#059669',
            brandAmber: '#D97706',
            brandRose: '#E11D48',
            wardenAmber: '#F59E0B',
            surfaceBg: '#F8FAFC',
            surfaceCard: '#FFFFFF',
            inkPrimary: '#0F172A',
            inkMuted: '#64748B',
            borderSubtle: '#E2E8F0',
            wardenBg: '#090E17',
            wardenSurface: '#151D2C',
          },
          boxShadow: {
            subtle: '0 2px 12px -2px rgba(15, 23, 42, 0.06), 0 1px 3px 0 rgba(15, 23, 42, 0.04)',
            raised: '0 10px 28px -4px rgba(15, 23, 42, 0.1), 0 4px 10px -2px rgba(15, 23, 42, 0.05)',
            floating: '0 20px 44px -8px rgba(15, 23, 42, 0.18), 0 8px 16px -4px rgba(15, 23, 42, 0.08)',
            elevation: '0 12px 32px -4px rgba(15, 23, 42, 0.12)',
            stickyBar: '0 -8px 24px -4px rgba(15, 23, 42, 0.08)',
            device: '0 25px 60px -15px rgba(15, 23, 42, 0.4), 0 0 0 10px #1E293B',
          }
        }
      }
    };
  </script>

  <style>
    html, body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overscroll-behavior: contain;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      background-color: #0B1320;
    }

    input, textarea, select {
      user-select: text !important;
      -webkit-user-select: text !important;
    }

    @keyframes sheetEntrance {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
    @keyframes toastEntrance {
      from { transform: translateY(-120%); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    @keyframes screenEnter {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes pulseRing {
      0% { transform: scale(0.97); opacity: 0.92; }
      50% { transform: scale(1.04); opacity: 0.55; }
      100% { transform: scale(0.97); opacity: 0.92; }
    }
    @keyframes haloExpand {
      0% { transform: scale(0.85); opacity: 0.65; }
      70% { transform: scale(1.38); opacity: 0; }
      100% { transform: scale(1.38); opacity: 0; }
    }
    @keyframes dashMove {
      to { stroke-dashoffset: -28; }
    }
    @keyframes radarSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes checkmarkDraw {
      0% { stroke-dashoffset: 48; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes carFollow {
      0% { transform: translate(0px, 0px); opacity: 1; }
      50% { transform: translate(96px, -24px); opacity: 1; }
      100% { transform: translate(192px, -14px); opacity: 1; }
    }

    .animate-sheet { animation: sheetEntrance 0.28s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .animate-toast { animation: toastEntrance 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .animate-screen { animation: screenEnter 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .stagger-1 { animation: screenEnter 0.2s cubic-bezier(0.16, 1, 0.3, 1) 0.04s both; }
    .stagger-2 { animation: screenEnter 0.2s cubic-bezier(0.16, 1, 0.3, 1) 0.08s both; }
    .stagger-3 { animation: screenEnter 0.2s cubic-bezier(0.16, 1, 0.3, 1) 0.12s both; }
    .animate-pulse-ring { animation: pulseRing 2.2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    .animate-halo { opacity: 0; animation: haloExpand 2.2s cubic-bezier(0.16, 1, 0.3, 1) 2 forwards; }
    .animate-route { animation: dashMove 1.4s linear infinite; }
    .animate-radar { animation: radarSpin 1.8s linear infinite; transform-origin: center; }
    .animate-check-draw {
      stroke-dasharray: 48;
      stroke-dashoffset: 48;
      animation: checkmarkDraw 0.45s cubic-bezier(0.16, 1, 0.3, 1) 0.1s forwards;
    }
    .animate-car-path {
      animation: carFollow 2.6s ease-in-out infinite alternate;
    }

    .tap-scale {
      transition: transform 0.1s ease, opacity 0.1s ease;
    }
    .tap-scale:active {
      transform: scale(0.97);
    }

    .amber-hatched {
      background-image: repeating-linear-gradient(
        -45deg,
        rgba(217, 119, 6, 0.18),
        rgba(217, 119, 6, 0.18) 6px,
        rgba(120, 53, 15, 0.35) 6px,
        rgba(120, 53, 15, 0.35) 12px
      );
    }

    .emerald-striped {
      background-image: repeating-linear-gradient(
        -45deg,
        #059669,
        #059669 5px,
        #10B981 5px,
        #10B981 10px
      );
    }

    .asphalt-surface {
      background-color: #0F172A;
      background-image:
        radial-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 0),
        linear-gradient(180deg, #0F172A 0%, #090E1A 100%);
      background-size: 12px 12px, 100% 100%;
    }

    .bay-glow-blue {
      box-shadow: 0 0 16px -1px rgba(37, 99, 235, 0.55), inset 0 0 8px rgba(59, 130, 246, 0.25);
    }

    .bay-glow-emerald {
      box-shadow: 0 0 16px -1px rgba(16, 185, 129, 0.5), inset 0 0 8px rgba(16, 185, 129, 0.2);
    }

    .custom-scroll::-webkit-scrollbar { width: 4px; height: 4px; }
    .custom-scroll::-webkit-scrollbar-track { background: transparent; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 9999px; }

    @media (prefers-reduced-motion: reduce) {
      *, ::before, ::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body class="text-inkPrimary min-h-[100dvh] flex items-center justify-center p-0 min-[481px]:p-4 overflow-x-hidden">

  <div id="root" class="w-full h-full flex items-center justify-center"></div>

  <script type="text/babel">
    const { useReducer, useEffect, useLayoutEffect, useState, useRef } = React;

    // --- DATA MODEL: MG ROAD ZONE (20 BAYS) ---
    // 10 Occupied, 8 Ghost Holds (Unclaimed reservations), 2 Available (B-08 demo & B-14 reassignment)
    const INITIAL_BAYS = [
      { id: 'B-01', status: 'occupied' },
      { id: 'B-02', status: 'occupied' },
      { id: 'B-03', status: 'occupied' },
      { id: 'B-04', status: 'occupied' },
      { id: 'B-05', status: 'occupied' },
      { id: 'B-06', status: 'occupied' },
      { id: 'B-07', status: 'occupied' },
      { id: 'B-08', status: 'available' },
      { id: 'B-09', status: 'occupied' },
      { id: 'B-10', status: 'occupied' },
      { id: 'B-11', status: 'occupied' },
      { id: 'B-12', status: 'ghost' },
      { id: 'B-13', status: 'ghost' },
      { id: 'B-14', status: 'available' },
      { id: 'B-15', status: 'ghost' },
      { id: 'B-16', status: 'ghost' },
      { id: 'B-17', status: 'ghost' },
      { id: 'B-18', status: 'ghost' },
      { id: 'B-19', status: 'ghost' },
      { id: 'B-20', status: 'ghost' },
    ];

    const INITIAL_STATE = {
      driverTab: 'explore', // 'explore' | 'booking' | 'wallet'
      driverScreen: 'S0',   // 'S0' | 'S1' | 'S2' | 'S3' | 'S4' | 'S6'
      wardenTab: 'tasks',   // 'tasks' | 'zone'
      activeRole: 'driver', // 'driver' | 'warden' for screen width < 1280px

      autoReleaseActive: false,
      nearZone: false,
      zoneFullBranch: false,
      squatterPresent: true,

      bays: INITIAL_BAYS,
      walletBalance: 250,
      walletLedger: [
        { id: 'tx-0', title: 'Opening Balance', amount: 250, type: 'credit', time: 'Today, 8:45 AM' }
      ],

      booking: {
        status: 'none', // 'none' | 'active' | 'checked_in' | 'released' | 'completed' | 'transferred' | 'refunded'
        bay: 'B-08',
        zoneName: 'MG Road Zone',
        slot: '9:00 AM – 11:00 AM',
        arrivalDeadline: '9:15 AM',
        amountPaid: 120,
        secondsRemaining: 900,
        extensionApplied: false,
        conflictSubmitted: false,
        conflictResult: null, // 'reassigned' | 'zone_full'
        reassignedBay: null,
        enteredPlate: '4021',
        firstNoShowEligible: true,
        lastReleaseWaived: false,
      },

      wardenTasks: [],
      resolvedTasksCount: 0,
      totalResponseTimeSec: 0,

      toasts: {
        driver: null,
        warden: null,
      },
      activeModal: null, // null | 'cancel_pass' | 'conflict_sheet' | 'switch_zone' | 'refund_flow'
      lookupStep: 0,
      reviewerDrawerOpen: false,
      navigatingActive: false,
    };

    // --- HELPER: PUT TOAST IN TARGET SLOT ---
    function withToast(state, target, message, type = 'info') {
      return {
        ...state.toasts,
        [target]: { message, type, id: Date.now() + Math.random() }
      };
    }

    // --- PURE ROOT REDUCER ---
    function rootReducer(state, action) {
      switch (action.type) {
        // H1 & G2: Preserve driverScreen when switching to Wallet; restore exact screen when returning to Booking
        case 'NAVIGATE_DRIVER_TAB': {
          let nextScreen = state.driverScreen;
          if (action.tab === 'explore') {
            nextScreen = 'S0';
          } else if (action.tab === 'booking') {
            if (state.driverTab === 'wallet' && ['S1', 'S2', 'S3', 'S4', 'S6'].includes(state.driverScreen)) {
              nextScreen = state.driverScreen;
            } else if (state.booking.status === 'active') {
              nextScreen = state.driverScreen === 'S1' ? 'S1' : 'S2';
            } else if (state.booking.status === 'checked_in') {
              nextScreen = state.booking.conflictSubmitted ? 'S6' : 'S4';
            } else if (['released', 'completed', 'transferred', 'refunded'].includes(state.booking.status)) {
              nextScreen = 'S3';
            } else {
              nextScreen = 'S0';
            }
          }
          // When action.tab === 'wallet', nextScreen remains state.driverScreen untouched
          return { ...state, driverTab: action.tab, driverScreen: nextScreen };
        }

        case 'SET_DRIVER_SCREEN':
          return { ...state, driverScreen: action.screen };

        case 'SET_WARDEN_TAB':
          return { ...state, wardenTab: action.tab };

        case 'SWITCH_ROLE':
          return { ...state, activeRole: action.role };

        case 'SET_AUTO_RELEASE_LENS':
          return { ...state, autoReleaseActive: action.value };

        case 'SET_NEAR_ZONE':
          return { ...state, nearZone: action.value };

        case 'SET_ZONE_FULL_BRANCH': {
          let updatedBays = state.bays;
          if (action.value) {
            updatedBays = state.bays.map(b => (b.id === 'B-14' && b.status === 'available') ? { ...b, status: 'occupied' } : b);
          } else {
            if (state.booking.reassignedBay !== 'B-14') {
              updatedBays = state.bays.map(b => (b.id === 'B-14' && b.status === 'occupied') ? { ...b, status: 'available' } : b);
            }
          }
          return { ...state, zoneFullBranch: action.value, bays: updatedBays };
        }

        case 'SET_SQUATTER':
          return { ...state, squatterPresent: action.value };

        case 'TOGGLE_REVIEWER_DRAWER':
          return { ...state, reviewerDrawerOpen: !state.reviewerDrawerOpen };

        case 'OPEN_MODAL':
          return { ...state, activeModal: action.modal, lookupStep: 0 };

        case 'CLOSE_MODAL':
          return { ...state, activeModal: null, lookupStep: 0 };

        case 'SHOW_TOAST': {
          const target = action.target || 'driver';
          return {
            ...state,
            toasts: withToast(state, target, action.message, action.toastType || 'info')
          };
        }

        case 'DISMISS_TOAST': {
          const target = action.target || 'driver';
          return {
            ...state,
            toasts: { ...state.toasts, [target]: null }
          };
        }

        // H3: CONFIRM_RESERVATION also sets driverTab: 'booking' so Booking tab highlights and mini-bar stays hidden on S1
        case 'CONFIRM_RESERVATION': {
          if (state.booking.status !== 'none' && state.booking.status !== 'released') {
            return {
              ...state,
              toasts: withToast(state, 'driver', 'You already have an active reservation.', 'warning')
            };
          }
          if (state.walletBalance < 120) {
            return {
              ...state,
              toasts: withToast(state, 'driver', 'Insufficient wallet balance for reservation.', 'danger')
            };
          }
          const updatedBays = state.bays.map(b => b.id === 'B-08' ? { ...b, status: 'reserved_unclaimed' } : b);
          const newLedger = [
            { id: 'tx-' + Date.now(), title: 'Parking Pass: Bay B-08 (9:00 - 11:00 AM)', amount: 120, type: 'debit', time: 'Just now' },
            ...state.walletLedger
          ];
          return {
            ...state,
            walletBalance: state.walletBalance - 120,
            walletLedger: newLedger,
            bays: updatedBays,
            navigatingActive: false,
            booking: {
              ...state.booking,
              status: 'active',
              bay: 'B-08',
              secondsRemaining: 900,
              extensionApplied: false,
              conflictSubmitted: false,
              conflictResult: null,
              reassignedBay: null
            },
            driverTab: 'booking',
            driverScreen: 'S1',
            toasts: withToast(state, 'driver', 'Pass confirmed. 15-minute arrival window active.', 'success')
          };
        }

        case 'CLOCK_TICK': {
          if (state.booking.status !== 'active' || state.booking.secondsRemaining <= 0) {
            return state;
          }
          if (state.booking.secondsRemaining === 1) {
            return executeNoShowRelease(state, 'timeout');
          }
          return {
            ...state,
            booking: { ...state.booking, secondsRemaining: state.booking.secondsRemaining - 1 }
          };
        }

        case 'ADD_LATE_BUFFER': {
          if (state.booking.status !== 'active' || state.booking.extensionApplied) {
            return state;
          }
          return {
            ...state,
            booking: {
              ...state.booking,
              secondsRemaining: state.booking.secondsRemaining + 600,
              extensionApplied: true
            },
            toasts: withToast(state, 'driver', '10-minute buffer added to arrival window.', 'success')
          };
        }

        case 'PERFORM_CHECK_IN': {
          if (state.booking.status !== 'active' || !state.nearZone) {
            return state;
          }
          const updatedBays = state.bays.map(b => b.id === 'B-08' ? { ...b, status: 'reserved_checked_in' } : b);
          return {
            ...state,
            bays: updatedBays,
            booking: { ...state.booking, status: 'checked_in' },
            driverTab: 'booking',
            driverScreen: 'S3',
            toasts: withToast(state, 'driver', 'Arrival verified via GPS. Bay B-08 secured.', 'success')
          };
        }

        case 'TRIGGER_RELEASE': {
          return executeNoShowRelease(state, action.reason || 'user_cancel');
        }

        case 'STEP_LOOKUP': {
          const plateValue = (action.plate && action.plate.trim()) ? action.plate.trim() : (state.booking.enteredPlate || '4021');
          return {
            ...state,
            lookupStep: action.step,
            booking: { ...state.booking, enteredPlate: plateValue }
          };
        }

        case 'RESOLVE_CONFLICT_SEARCH': {
          if (state.booking.conflictSubmitted) return state;

          const isZoneFull = state.zoneFullBranch;
          const resultType = isZoneFull ? 'zone_full' : 'reassigned';
          const plateSaved = action.plate || state.booking.enteredPlate || '4021';

          const updatedBays = state.bays.map(b => {
            if (b.id === 'B-08') return { ...b, status: 'occupied_by_squatter' };
            if (!isZoneFull && b.id === 'B-14') return { ...b, status: 'reserved_checked_in' };
            if (isZoneFull && b.id === 'B-14') return { ...b, status: 'occupied' };
            return b;
          });

          const createdTask = {
            id: 'task-' + Date.now(),
            bay: 'B-08',
            plate: plateSaved,
            timestamp: Date.now(),
            status: 'pending',
            resolutionText: null,
            elapsedSec: 0,
            outcomeDetail: isZoneFull ? 'Driver reviewing alternatives' : 'Driver reassigned to Bay B-14'
          };

          return {
            ...state,
            bays: updatedBays,
            activeModal: null,
            lookupStep: 0,
            navigatingActive: false,
            booking: {
              ...state.booking,
              conflictSubmitted: true,
              conflictResult: resultType,
              reassignedBay: isZoneFull ? null : 'B-14',
              enteredPlate: plateSaved,
            },
            wardenTasks: [createdTask, ...state.wardenTasks],
            driverTab: 'booking',
            driverScreen: 'S6',
            toasts: {
              driver: { message: 'Alternative secured in under 90 seconds. Warden notified.', type: 'warning', id: Date.now() },
              warden: { message: 'New task: Bay B-08 unauthorized vehicle', type: 'warning', id: Date.now() + 1 }
            }
          };
        }

        case 'START_NAVIGATING':
          return { ...state, navigatingActive: true };

        case 'COMPLETE_PARKING': {
          const targetBay = state.booking.reassignedBay || state.booking.bay;
          const updatedBays = state.bays.map(b => b.id === targetBay ? { ...b, status: 'occupied' } : b);
          return {
            ...state,
            bays: updatedBays,
            navigatingActive: false,
            booking: { ...state.booking, status: 'completed' },
            driverTab: 'booking',
            driverScreen: 'S3',
            toasts: withToast(state, 'driver', 'Parking session active. Have a great day!', 'success')
          };
        }

        case 'TRANSFER_BRIGADE_ZONE': {
          const updatedTasks = state.wardenTasks.map(t => {
            if (t.bay === 'B-08') return { ...t, outcomeDetail: 'Driver transferred to Brigade Rd Zone' };
            return t;
          });
          return {
            ...state,
            activeModal: null,
            navigatingActive: false,
            booking: { ...state.booking, status: 'transferred' },
            wardenTasks: updatedTasks,
            driverTab: 'booking',
            driverScreen: 'S3',
            toasts: withToast(state, 'driver', 'Transferred to Brigade Rd (Bay A-04).', 'success')
          };
        }

        case 'PROCESS_FULL_REFUND': {
          const refundAmount = 170;
          const newLedger = [
            { id: 'tx-' + Date.now(), title: 'Refund (₹120) + Inconvenience Credit (₹50)', amount: refundAmount, type: 'credit', time: 'Just now' },
            ...state.walletLedger
          ];
          const updatedTasks = state.wardenTasks.map(t => {
            if (t.bay === 'B-08') return { ...t, outcomeDetail: 'Driver refunded' };
            return t;
          });
          return {
            ...state,
            walletBalance: state.walletBalance + refundAmount,
            walletLedger: newLedger,
            activeModal: null,
            navigatingActive: false,
            booking: { ...state.booking, status: 'refunded' },
            wardenTasks: updatedTasks,
            driverTab: 'booking',
            driverScreen: 'S3',
            toasts: withToast(state, 'driver', '₹170 credited instantly to wallet.', 'success')
          };
        }

        // H9: Guard WARDEN_ACTION so an already-resolved task cannot double-count response stats
        case 'WARDEN_ACTION': {
          const targetTask = state.wardenTasks.find(t => t.id === action.taskId);
          if (!targetTask || targetTask.status === 'resolved') {
            return state;
          }

          const elapsed = Math.max(1, Math.floor((Date.now() - action.taskTimestamp) / 1000));
          const formattedTime = elapsed < 60 ? `${elapsed}s` : `${Math.floor(elapsed / 60)}m ${elapsed % 60}s`;

          const updatedTasks = state.wardenTasks.map(t => {
            if (t.id === action.taskId) {
              return {
                ...t,
                status: 'resolved',
                resolutionText: `${action.label} in ${formattedTime}`,
                elapsedSec: elapsed
              };
            }
            return t;
          });

          return {
            ...state,
            wardenTasks: updatedTasks,
            resolvedTasksCount: state.resolvedTasksCount + 1,
            totalResponseTimeSec: state.totalResponseTimeSec + elapsed,
            toasts: withToast(state, 'warden', `Task recorded: ${action.label}`, 'info')
          };
        }

        case 'APPLY_SCENARIO':
          return buildScenarioState(state, action.scenarioId);

        case 'RESET_ALL':
          return INITIAL_STATE;

        default:
          return state;
      }
    }

    // Helper: Stores lastReleaseWaived so S3 Breakdown matches Ledger, Toast, and Wallet
    function executeNoShowRelease(state, reason) {
      if (state.booking.status !== 'active') return state;

      const updatedBays = state.bays.map(b => b.id === 'B-08' ? { ...b, status: 'available' } : b);
      const wasFirstEligible = state.booking.firstNoShowEligible;
      const creditAmount = wasFirstEligible ? 120 : 90;

      const newLedger = [
        {
          id: 'tx-' + Date.now(),
          title: wasFirstEligible ? 'No-Show Credit (First Fee Waived)' : 'No-Show Credit (75% Credited)',
          amount: creditAmount,
          type: 'credit',
          time: 'Just now'
        },
        ...state.walletLedger
      ];

      return {
        ...state,
        walletBalance: state.walletBalance + creditAmount,
        walletLedger: newLedger,
        bays: updatedBays,
        booking: {
          ...state.booking,
          status: 'released',
          secondsRemaining: 0,
          firstNoShowEligible: false,
          lastReleaseWaived: wasFirstEligible,
        },
        driverTab: 'booking',
        driverScreen: 'S3',
        activeModal: null,
        toasts: withToast(
          state,
          'driver',
          wasFirstEligible ? 'Bay released. ₹120 credited (First fee waived).' : 'Bay released. ₹90 credited (25% fee retained).',
          'info'
        )
      };
    }

    // Helper: Coherent Scenario Snapshots (H5 fixes Scenario 8)
    function buildScenarioState(state, scenarioId) {
      switch (scenarioId) {
        case 1:
          return {
            ...INITIAL_STATE,
            autoReleaseActive: false,
            driverScreen: 'S0',
            driverTab: 'explore',

    // --- WALLET NUMBER TWEEN HOOK (400ms) ---
    function useAnimatedNumber(targetValue, duration = 400) {
      const [displayValue, setDisplayValue] = useState(targetValue);
      const prevValueRef = useRef(targetValue);

      useEffect(() => {
        const startValue = prevValueRef.current;
        const diff = targetValue - startValue;
        if (diff === 0) return;

        const prefersReduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (prefersReduced) {
          setDisplayValue(targetValue);
          prevValueRef.current = targetValue;
          return;
        }

        let startTime = null;
        let rafId = null;

        const step = (timestamp) => {
          if (!startTime) startTime = timestamp;
          const elapsed = timestamp - startTime;
          const progress = Math.min(1, elapsed / duration);
          const eased = 1 - Math.pow(1 - progress, 3);
          setDisplayValue(Math.round(startValue + diff * eased));

          if (progress < 1) {
            rafId = requestAnimationFrame(step);
          } else {
            prevValueRef.current = targetValue;
          }
        };

        rafId = requestAnimationFrame(step);
        return () => {
          if (rafId) cancelAnimationFrame(rafId);
        };
      }, [targetValue, duration]);

      return displayValue;
    }

      useEffect(() => {
        if (state.toasts.warden) {
          const t = setTimeout(() => dispatch({ type: 'DISMISS_TOAST', target: 'warden' }), 3500);
          return () => clearTimeout(t);
        }
      }, [state.toasts.warden]);

      useEffect(() => {
        if (state.activeModal === 'conflict_sheet' && state.lookupStep > 0 && state.lookupStep < 3) {
          const t = setTimeout(() => {
            dispatch({ type: 'STEP_LOOKUP', step: state.lookupStep + 1, plate: state.booking.enteredPlate });
          }, 700);
          return () => clearTimeout(t);
        } else if (state.activeModal === 'conflict_sheet' && state.lookupStep === 3) {
          const t = setTimeout(() => {
            dispatch({ type: 'RESOLVE_CONFLICT_SEARCH', plate: state.booking.enteredPlate });
          }, 700);
          return () => clearTimeout(t);
        }
      }, [state.activeModal, state.lookupStep, state.booking.enteredPlate]);

      const formatMmSs = (totalSec) => {
        const m = Math.floor(totalSec / 60);
        const s = totalSec % 60;
        return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
      };

      return (
        <div className="w-full flex flex-col xl:flex-row items-center xl:items-start justify-center gap-8 max-w-7xl mx-auto">
          
          <div className="flex flex-col md:flex-row items-center justify-center gap-8 w-full xl:w-auto">
            
            {/* DRIVER PHONE SHELL */}
            <div className={`w-full md:w-auto ${state.activeRole !== 'driver' ? 'hidden xl:block' : 'block'}`}>
              <DeviceShell label="Driver Experience" theme="driver">
                <DriverAppView state={state} dispatch={dispatch} formatMmSs={formatMmSs} />
              </DeviceShell>
            </div>

            {/* WARDEN PHONE SHELL */}
            <div className={`w-full md:w-auto ${state.activeRole !== 'warden' ? 'hidden xl:block' : 'block'}`}>
              <DeviceShell label="Field Warden Companion" theme="warden">
                <WardenAppView state={state} dispatch={dispatch} />
              </DeviceShell>
            </div>

          </div>

          {/* Reviewer Tools Handle (44px icon handle on <=480px; labelled pill on >=481px) */}
          <button
            type="button"
            onClick={() => dispatch({ type: 'TOGGLE_REVIEWER_DRAWER' })}
            aria-label="Open Reviewer Tools"
            className="fixed z-40 bg-brandNavy/85 hover:bg-brandNavy text-white backdrop-blur-sm border border-slate-700 shadow-floating flex items-center justify-center gap-2 text-xs font-display font-bold tap-scale focus:outline-none focus:ring-2 focus:ring-brandBlue max-[480px]:top-[38%] max-[480px]:right-0 max-[480px]:w-11 max-[480px]:h-11 max-[480px]:rounded-l-2xl max-[480px]:border-r-0 min-[481px]:bottom-5 min-[481px]:right-5 min-[481px]:min-h-[44px] min-[481px]:rounded-full min-[481px]:px-4 min-[481px]:py-2.5"
          >
            <div className="w-4 h-4 text-brandBlue shrink-0"><Icon.Sliders /></div>
            <span className="hidden min-[481px]:inline">Reviewer Tools</span>
          </button>

          {/* Reviewer Tools Drawer */}
          {state.reviewerDrawerOpen && (
            <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-end justify-center">
              <div className="w-full max-w-xl bg-slate-900 border-t border-slate-700 rounded-t-3xl p-6 text-white max-h-[85vh] overflow-y-auto animate-sheet custom-scroll space-y-5">
                <div className="flex items-center justify-between pb-3 border-b border-slate-800">
                  <div>
                    <h3 className="font-display text-lg font-bold text-slate-100">Reviewer Tools</h3>
                    <p className="text-sm text-slate-400">Assignment validation controls & scenario snapshots</p>
                  </div>
                  <button
                    type="button"
                    onClick={() => dispatch({ type: 'TOGGLE_REVIEWER_DRAWER' })}
                    className="min-h-[44px] px-4 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-full text-xs font-display font-bold tap-scale focus:outline-none focus:ring-2 focus:ring-brandBlue"
                  >
                    Done
                  </button>
                </div>

                {/* Role Switcher on <1280px */}
                <div className="xl:hidden bg-slate-950 p-1 rounded-2xl border border-slate-800 flex text-xs font-display font-bold">
                  <button
                    type="button"
                    onClick={() => dispatch({ type: 'SWITCH_ROLE', role: 'driver' })}
                    className={`flex-1 min-h-[44px] py-2 rounded-xl transition-all ${state.activeRole === 'driver' ? 'bg-brandBlue text-white shadow-sm' : 'text-slate-400'}`}
                  >
                    Driver App View
                  </button>
                  <button
                    type="button"
                    onClick={() => dispatch({ type: 'SWITCH_ROLE', role: 'warden' })}
                    className={`flex-1 min-h-[44px] py-2 rounded-xl transition-all ${state.activeRole === 'warden' ? 'bg-wardenAmber text-slate-950 shadow-sm' : 'text-slate-400'}`}
                  >
                    Warden Companion View
                  </button>
                </div>

                {/* Simulation Variables */}
                <div className="space-y-2.5">
                  <span className="text-xs font-display font-bold uppercase tracking-wider text-slate-400">Simulation Variables</span>
                  
                  <label className="flex items-center justify-between p-3.5 bg-slate-950 rounded-2xl border border-slate-800 cursor-pointer">
                    <div>
                      <span className="text-sm font-semibold text-slate-200 block">Simulate GPS Near Zone (&lt;100 m)</span>
                      <span className="text-xs text-slate-400">Enables arrival check-in CTA</span>
                    </div>
                    <input
                      type="checkbox"
                      checked={state.nearZone}
                      onChange={(e) => dispatch({ type: 'SET_NEAR_ZONE', value: e.target.checked })}
                      className="w-5 h-5 accent-blue-600 rounded cursor-pointer"
                    />
                  </label>

                  <label className="flex items-center justify-between p-3.5 bg-slate-950 rounded-2xl border border-slate-800 cursor-pointer">
                    <div>
                      <span className="text-sm font-semibold text-slate-200 block">Squatter Parked in Bay B-08</span>
                      <span className="text-xs text-slate-400">Triggers conflict recovery on arrival</span>
                    </div>
                    <input
                      type="checkbox"
                      checked={state.squatterPresent}
                      onChange={(e) => dispatch({ type: 'SET_SQUATTER', value: e.target.checked })}
                      className="w-5 h-5 accent-rose-600 rounded cursor-pointer"
                    />
                  </label>

                  <label className="flex items-center justify-between p-3.5 bg-slate-950 rounded-2xl border border-slate-800 cursor-pointer">
                    <div>
                      <span className="text-sm font-semibold text-slate-200 block">Simulate All Bays Full (Build 2 Fallback)</span>
                      <span className="text-xs text-slate-400">Forces Brigade Rd transfer or instant refund</span>
                    </div>
                    <input
                      type="checkbox"
                      checked={state.zoneFullBranch}
                      onChange={(e) => dispatch({ type: 'SET_ZONE_FULL_BRANCH', value: e.target.checked })}
                      className="w-5 h-5 accent-amber-500 rounded cursor-pointer"
                    />
                  </label>
                </div>

                {/* Instant Triggers */}
                <div className="space-y-2 pt-1">
                  <span className="text-xs font-display font-bold uppercase tracking-wider text-slate-400 block">Instant Triggers</span>
                  <div className="grid grid-cols-2 gap-2.5">
                    <button
                      type="button"
                      onClick={() => dispatch({ type: 'TRIGGER_RELEASE', reason: 'timeout' })}
                      disabled={state.booking.status !== 'active'}
                      className={`min-h-[44px] p-3 rounded-2xl border text-xs font-display font-bold transition-all ${
                        state.booking.status === 'active'
                          ? 'bg-slate-800 hover:bg-slate-700 text-amber-300 border-amber-600/40 tap-scale'
                          : 'bg-slate-950 text-slate-600 border-slate-800 cursor-not-allowed'
                      }`}
                    >
                      Fast-Forward Timer to 0
                    </button>
                    <button
                      type="button"
                      onClick={() => dispatch({ type: 'RESET_ALL' })}
                      className="min-h-[44px] p-3 bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 rounded-2xl text-xs font-display font-bold tap-scale"
                    >
                      Reset Entire Prototype
                    </button>
                  </div>
                </div>

                {/* Scenarios 1-8 */}
                <div className="space-y-2 pt-2 border-t border-slate-800">
                  <span className="text-xs font-display font-bold uppercase tracking-wider text-slate-400 block">
                    Jump to Evaluator Scenarios
                  </span>
                  <div className="grid grid-cols-2 sm:grid-cols-4 gap-2 text-xs font-semibold">
                    <button type="button" onClick={() => dispatch({ type: 'APPLY_SCENARIO', scenarioId: 1 })} className="min-h-[44px] p-2.5 bg-slate-950 hover:bg-slate-800 rounded-xl border border-slate-800 text-left tap-scale">1. Problem Today</button>
                    <button type="button" onClick={() => dispatch({ type: 'APPLY_SCENARIO', scenarioId: 2 })} className="min-h-[44px] p-2.5 bg-slate-950 hover:bg-slate-800 rounded-xl border border-slate-800 text-left tap-scale">2. Fix Lens</button>
                    <button type="button" onClick={() => dispatch({ type: 'APPLY_SCENARIO', scenarioId: 3 })} className="min-h-[44px] p-2.5 bg-slate-950 hover:bg-slate-800 rounded-xl border border-slate-800 text-left tap-scale">3. Active Booking</button>
                    <button type="button" onClick={() => dispatch({ type: 'APPLY_SCENARIO', scenarioId: 4 })} className="min-h-[44px] p-2.5 bg-slate-950 hover:bg-slate-800 rounded-xl border border-slate-800 text-left tap-scale">4. Auto-Release</button>
                    <button type="button" onClick={() => dispatch({ type: 'APPLY_SCENARIO', scenarioId: 5 })} className="min-h-[44px] p-2.5 bg-slate-950 hover:bg-slate-800 rounded-xl border border-slate-800 text-left tap-scale">5. Occupied Bay</button>
                    <button type="button" onClick={() => dispatch({ type: 'APPLY_SCENARIO', scenarioId: 6 })} className="min-h-[44px] p-2.5 bg-slate-950 hover:bg-slate-800 rounded-xl border border-slate-800 text-left tap-scale">6. Reassigned B-14</button>
                    <button type="button" onClick={() => dispatch({ type: 'APPLY_SCENARIO', scenarioId: 7 })} className="min-h-[44px] p-2.5 bg-slate-950 hover:bg-slate-800 rounded-xl border border-slate-800 text-left tap-scale">7. Zone Full</button>
                    <button type="button" onClick={() => dispatch({ type: 'APPLY_SCENARIO', scenarioId: 8 })} className="min-h-[44px] p-2.5 bg-slate-950 hover:bg-slate-800 rounded-xl border border-slate-800 text-left tap-scale">8. Warden Task</button>
                  </div>
                </div>

              </div>
            </div>
          )}

        </div>
      );
    }

    // =========================================================================
    // DEVICE SHELL
    // =========================================================================
    function DeviceShell({ children, label, theme = 'driver' }) {
      return (
        <div className="flex flex-col items-center">
          <div className="hidden min-[481px]:flex items-center gap-2 mb-2 text-xs font-display font-bold uppercase tracking-wider text-slate-400">
            <span className={`w-2 h-2 rounded-full ${theme === 'warden' ? 'bg-wardenAmber' : 'bg-brandBlue'}`}></span>
            <span>{label}</span>
          </div>

          <div className="relative w-screen h-[100dvh] min-[481px]:w-[390px] min-[481px]:h-[min(844px,calc(100dvh-64px))] bg-surfaceBg min-[481px]:rounded-[44px] min-[481px]:shadow-device flex flex-col overflow-hidden border-0 min-[481px]:border-[8px] min-[481px]:border-slate-800">
            
            {/* Status Bar (Desktop frame only) */}
            <div className={`hidden min-[481px]:flex justify-between items-center px-7 pt-3 pb-1 text-xs font-bold shrink-0 z-40 select-none ${
              theme === 'warden' ? 'bg-wardenBg text-slate-300' : 'bg-surfaceBg text-slate-800'
            }`}>
              <span className="font-display font-semibold tabular-nums">9:41</span>
              <div className="w-24 h-4 bg-slate-800 rounded-full mx-auto -mt-1 opacity-90 flex items-center justify-center">
                <div className="w-8 h-1 bg-slate-700 rounded-full"></div>
              </div>
              <div className="flex items-center gap-1.5">
                <span>5G</span>
                <div className="w-4 h-2.5 border border-current rounded-sm relative">
                  <div className="absolute inset-0.5 bg-current rounded-sm"></div>
                </div>
              </div>
            </div>

            <div className="flex-1 flex flex-col overflow-hidden relative">
              {children}
            </div>

            <div className="hidden min-[481px]:block w-32 h-1 bg-slate-300/70 rounded-full mx-auto my-1 shrink-0 z-40"></div>
          </div>
        </div>
      );
    }

    // =========================================================================
    // H2: BOOKING TAB EMPTY STATE COMPONENT
    // =========================================================================
    function ScreenBookingEmpty({ dispatch }) {
      return (
        <div className="bg-white rounded-3xl border border-borderSubtle shadow-raised p-6 text-center space-y-4 animate-screen my-2">
          <div className="w-16 h-16 rounded-full bg-blue-50 text-brandBlue border border-blue-100 flex items-center justify-center mx-auto shadow-subtle">
            <div className="w-8 h-8"><Icon.Clock /></div>
          </div>
          <div className="space-y-1.5">
            <h2 className="font-display text-[24px] leading-[30px] font-bold text-brandNavy tracking-tight">
              No active booking
            </h2>
            <p className="text-sm text-inkMuted leading-relaxed px-2">
              Reserve a bay from Explore to start a 15-minute arrival window.
            </p>
          </div>
          <div className="pt-1">
            <Btn
              variant="primary"
              onClick={() => dispatch({ type: 'NAVIGATE_DRIVER_TAB', tab: 'explore' })}
              trailingIcon={<Icon.ArrowRight />}
            >
              Go to Explore
            </Btn>
          </div>
        </div>
      );
    }

    // =========================================================================
    // DRIVER APPLICATION VIEW (H1, H2, H3, H7, H8, B8)
    // =========================================================================
    function DriverAppView({ state, dispatch, formatMmSs }) {
      const { booking, driverTab, driverScreen, toasts } = state;
      const isBookingActive = booking.status === 'active';
      const driverToast = toasts.driver;
      const animatedBalance = useAnimatedNumber(state.walletBalance, 400);

      const canReserve = booking.status === 'none' || booking.status === 'released';
      let reserveDisableReason = null;
      let reserveDemoChip = null;
      if (!canReserve) {
        if (booking.status === 'active' || booking.status === 'checked_in') {
          reserveDisableReason = 'You already have a booking in progress.';
        } else {
          reserveDisableReason = 'Booking complete.';
          reserveDemoChip = 'Reset in Reviewer Tools to run again.';
        }
      }

      // B8 & H1 & H2: Sticky Bottom Action Bar (hidden on Wallet and on empty Booking tab)
      const renderStickyActionBar = () => {
        if (driverTab === 'wallet') return null;
        if (driverTab === 'booking' && booking.status === 'none') return null;

        const barClasses = "shrink-0 bg-white/95 backdrop-blur-lg border-t border-borderSubtle shadow-stickyBar px-5 py-3.5 z-20 space-y-2.5";

        if (driverTab === 'explore' && driverScreen === 'S0') {
          return (
            <div className={barClasses}>
              <div className="flex items-center justify-between text-sm">
                <div className="flex items-center gap-2">
                  <span className="font-semibold text-slate-500">Selected:</span>
                  <span className="font-display font-bold text-inkPrimary">Bay B-08</span>
                </div>
                <div className="font-display font-extrabold text-brandBlue text-base tabular-nums">
                  ₹120 <span className="font-sans font-medium text-xs text-slate-500">/ 2 hrs</span>
                </div>
              </div>
              <Btn
                variant="primary"
                onClick={() => dispatch({ type: 'CONFIRM_RESERVATION' })}
                disabled={!canReserve}
                reason={reserveDisableReason}
                demoChip={reserveDemoChip}
                trailingIcon={<Icon.ArrowRight />}
              >
                Reserve Bay B-08
              </Btn>
            </div>
          );
        }

        if (driverScreen === 'S1') {
          return (
            <div className={barClasses}>
              <Btn
                variant="primary"
                onClick={() => {
                  dispatch({ type: 'NAVIGATE_DRIVER_TAB', tab: 'booking' });
                  dispatch({ type: 'SET_DRIVER_SCREEN', screen: 'S2' });
                }}
                trailingIcon={<Icon.ChevronRight />}
              >
                View my booking
              </Btn>
            </div>
          );
        }

        if (driverScreen === 'S2') {
          return (
            <div className={barClasses}>
              <Btn
                variant="success"
                onClick={() => dispatch({ type: 'PERFORM_CHECK_IN' })}
                disabled={!state.nearZone}
                reason={!state.nearZone ? 'Move within 100 m to check in' : null}
                demoChip={!state.nearZone ? 'Toggle GPS Near Zone in Reviewer Tools' : null}
                trailingIcon={<Icon.Check />}
              >
                I have arrived — Check in
              </Btn>
              {/* H7: Uses done prop so applied buffer renders as an emerald-50 chip with check icon */}
              <Btn
                variant="secondary"
                onClick={() => dispatch({ type: 'ADD_LATE_BUFFER' })}
                done={booking.extensionApplied}
                leadingIcon={<Icon.Clock />}
              >
                {booking.extensionApplied ? '10-minute buffer applied' : 'Running late +10 min (One-time)'}
              </Btn>
            </div>
          );
        }

        if (driverScreen === 'S3') {
          if (booking.status === 'checked_in') {
            return (
              <div className={barClasses}>
                <Btn
                  variant="primary"
                  onClick={() => dispatch({ type: 'SET_DRIVER_SCREEN', screen: 'S4' })}
                  trailingIcon={<Icon.ArrowRight />}
                >
                  Go to Bay B-08
                </Btn>
              </div>
            );
          }
          if (booking.status === 'released') {
            return (
              <div className={barClasses}>
                <Btn
                  variant="primary"
                  onClick={() => {
                    dispatch({ type: 'SET_AUTO_RELEASE_LENS', value: true });
                    dispatch({ type: 'NAVIGATE_DRIVER_TAB', tab: 'explore' });
                    dispatch({ type: 'SET_DRIVER_SCREEN', screen: 'S0' });
                  }}
                  trailingIcon={<Icon.ArrowRight />}
                >
                  Find parking nearby
                </Btn>
              </div>
            );
          }
          return (
            <div className={barClasses}>
              <Btn
                variant="primary"
                onClick={() => {
                  dispatch({ type: 'NAVIGATE_DRIVER_TAB', tab: 'explore' });
                  dispatch({ type: 'SET_DRIVER_SCREEN', screen: 'S0' });
                }}
                trailingIcon={<Icon.ArrowRight />}
              >
                Back to Explore
              </Btn>
            </div>
          );
        }

        if (driverScreen === 'S4') {
          return (
            <div className={barClasses}>
              <Btn
                variant="destructive"
                onClick={() => dispatch({ type: 'OPEN_MODAL', modal: 'conflict_sheet' })}
                disabled={booking.conflictSubmitted}
                reason={booking.conflictSubmitted ? 'Conflict report already submitted' : null}
                leadingIcon={<Icon.AlertTriangle />}
              >
                Someone is in my spot
              </Btn>
              <Btn
                variant="success"
                onClick={() => dispatch({ type: 'COMPLETE_PARKING' })}
                disabled={state.squatterPresent}
                reason={state.squatterPresent ? 'Bay occupied' : null}
                trailingIcon={<Icon.Check />}
              >
                Park here
              </Btn>
            </div>
          );
        }

        if (driverScreen === 'S6') {
          const isReassigned = booking.conflictResult === 'reassigned';
          if (isReassigned) {
            return (
              <div className={barClasses}>
                <Btn
                  variant="secondary"
                  onClick={() => dispatch({ type: 'START_NAVIGATING' })}
                  leadingIcon={<Icon.Navigation />}
                >
                  {state.navigatingActive ? 'Guidance active to Bay B-14' : 'Navigate to B-14'}
                </Btn>
                <Btn
                  variant="success"
                  onClick={() => dispatch({ type: 'COMPLETE_PARKING' })}
                  trailingIcon={<Icon.Check />}
                >
                  I’ve parked in B-14
                </Btn>
              </div>
            );
          }
          return (
            <div className={barClasses}>
              <Btn
                variant="navy"
                onClick={() => dispatch({ type: 'OPEN_MODAL', modal: 'switch_zone' })}
                sublabel="Brigade Rd Zone, 400 m, Bay A-04"
                trailingIcon={<Icon.ArrowRight />}
              >
                Switch zone
              </Btn>
              <Btn
                variant="success"
                onClick={() => dispatch({ type: 'OPEN_MODAL', modal: 'refund_flow' })}
                sublabel="₹120 refund + ₹50 credit = ₹170"
                trailingIcon={<Icon.Check />}
              >
                Refund me instantly
              </Btn>
            </div>
          );
        }

        return null;
      };

      return (
        <div className="flex-1 flex flex-col bg-surfaceBg text-inkPrimary overflow-hidden relative font-sans">
          
          {/* Driver Phone Toast Banner */}
          {driverToast && (
            <div key={driverToast.id} className="absolute top-3 inset-x-4 z-50 animate-toast pointer-events-auto">
              <div className={`px-4 py-3 rounded-2xl shadow-floating border flex items-center gap-2.5 text-xs font-semibold backdrop-blur-md ${
                driverToast.type === 'success' ? 'bg-emerald-950/95 border-emerald-500 text-emerald-100' :
                driverToast.type === 'danger' ? 'bg-rose-950/95 border-rose-500 text-rose-100' :
                driverToast.type === 'warning' ? 'bg-amber-950/95 border-amber-500 text-amber-100' :
                'bg-slate-900/95 border-slate-700 text-slate-100'
              }`}>
                <div className="w-4 h-4 shrink-0">
                  {driverToast.type === 'success' ? <Icon.Check /> :
                   driverToast.type === 'danger' ? <Icon.AlertTriangle /> :
                   driverToast.type === 'warning' ? <Icon.AlertTriangle /> : <Icon.Info />}
                </div>
                <span className="flex-1 leading-snug">{driverToast.message}</span>
              </div>
            </div>
          )}

          {/* Header with Wordmark, MG Road live chip, and H8 min-h-[44px] Wallet Pill */}
          <header className="px-5 py-2.5 bg-white/95 backdrop-blur-md border-b border-borderSubtle flex items-center justify-between shrink-0 z-30">
            <div className="flex items-center gap-2.5">
              <div className="w-8 h-8 rounded-xl bg-brandNavy text-white flex items-center justify-center p-1.5 shadow-subtle">
                <Icon.PinP />
              </div>
              <div className="flex items-center gap-2">
                <span className="font-display font-extrabold text-base tracking-tight text-brandNavy">SwiftPark</span>
                <span className="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full bg-emerald-50 border border-emerald-200 text-xs font-semibold text-emerald-800">
                  <span className="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
                  <span>MG Road</span>
                </span>
              </div>
            </div>

            {/* H8: min-h-[44px] wallet pill */}
            <button
              type="button"
              onClick={() => dispatch({ type: 'NAVIGATE_DRIVER_TAB', tab: 'wallet' })}
              className="min-h-[44px] flex items-center gap-1.5 px-3.5 py-1.5 rounded-full bg-slate-100 hover:bg-slate-200 border border-slate-200 text-xs font-bold text-brandNavy tap-scale focus:outline-none focus:ring-2 focus:ring-brandBlue"
              aria-label="Open SwiftPark Wallet"
            >
              <div className="w-4 h-4 text-emerald-600"><Icon.Wallet /></div>
              <span className="font-display font-bold text-sm tabular-nums">₹{animatedBalance}</span>
            </button>
          </header>

          {/* Active Booking Mini-Bar when navigating Explore or Wallet */}
          {isBookingActive && driverTab !== 'booking' && (
            <button
              type="button"
              onClick={() => dispatch({ type: 'NAVIGATE_DRIVER_TAB', tab: 'booking' })}
              className="mx-5 mt-2.5 px-4 py-2.5 bg-brandNavy text-white rounded-2xl shadow-raised flex items-center justify-between text-xs cursor-pointer tap-scale shrink-0 z-20 border border-blue-500/30"
            >
              <div className="flex items-center gap-2">
                <span className="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span>
                <span className="font-display font-bold">Bay B-08</span>
                <span className="text-slate-400">·</span>
                <span className="font-semibold text-amber-300 tabular-nums">{formatMmSs(booking.secondsRemaining)} left to check in</span>
              </div>

                  <svg className="w-4 h-3 fill-current text-slate-300 opacity-100" viewBox="0 0 24 24"><path d="M5 3l9 9-9 9 2 2 11-11L7 1z"/></svg>

    // J2 & B2: 72px Bay Map Tile with sweeping-scoped stagger delay
    function BayMapButton({ bay, index, autoReleaseActive, sweeping, booking, dispatch }) {
      const isB08 = bay.id === 'B-08';
      const isB14 = bay.id === 'B-14';
      const isGhost = bay.status === 'ghost';
      const isOccupied = bay.status === 'occupied';
      const isSquatter = bay.status === 'occupied_by_squatter';
      const isAvailable = bay.status === 'available';
      const isReservedUnclaimed = bay.status === 'reserved_unclaimed';
      const isReservedCheckedIn = bay.status === 'reserved_checked_in';

      // B2: Deterministic neutral car tints based on bay number
      const bayNum = parseInt(bay.id.slice(2), 10) || 1;
      const carTints = ['text-slate-400', 'text-zinc-300', 'text-slate-300', 'text-stone-400'];
      const carTintClass = carTints[bayNum % carTints.length];

      let bg = 'bg-slate-900/95 border-slate-700/90 text-slate-300';
      let label = 'Taken';
      let icon = <div className={`w-7 h-7 ${carTintClass}`}><Icon.CarTop /></div>;

      if (isOccupied) {
        bg = 'bg-slate-900/95 border-slate-700/90 text-slate-300';
        label = 'Taken';
        icon = <div className={`w-7 h-7 ${carTintClass}`}><Icon.CarTop /></div>;
      } else if (isSquatter) {
        bg = 'bg-rose-950/90 border-rose-500 text-rose-200';
        label = 'Conflict';
        icon = (
          <div className="relative w-7 h-7 text-rose-400">
            <Icon.CarTop />
            <span className="absolute -top-0.5 -right-0.5 w-2.5 h-2.5 rounded-full bg-rose-500 border border-slate-950 animate-pulse"></span>
          </div>
        );
      } else if (isGhost) {
        if (!autoReleaseActive) {
          bg = 'amber-hatched border-amber-500/90 text-amber-200';
          label = 'No-show';
          icon = <div className="w-5 h-5 text-amber-400"><Icon.Hourglass /></div>;
        } else {
          bg = 'bg-emerald-950/90 border-emerald-500 text-emerald-200';
          label = 'Freed';
          icon = <span className="font-display font-extrabold text-base text-emerald-400">P</span>;
        }
      } else if (isAvailable) {
        bg = 'bg-emerald-950/90 border-emerald-500 text-emerald-200';
        label = 'Free';
        icon = <span className="font-display font-extrabold text-base text-emerald-400">P</span>;
      }

      if (isB08) {
        if (isReservedUnclaimed) {
          bg = 'bg-blue-950 border-blue-400 text-blue-100 ring-2 ring-blue-400 bay-glow-blue animate-pulse-ring';
          label = 'Yours';
          icon = <div className="w-5 h-5 text-blue-300"><Icon.Clock /></div>;
        } else if (isReservedCheckedIn) {
          bg = 'bg-blue-900 border-emerald-400 text-blue-100 ring-2 ring-emerald-500 bay-glow-emerald';
          label = 'Checked in';
          icon = <div className="w-5 h-5 text-emerald-300"><Icon.Check /></div>;
        } else if (booking.status === 'none' || booking.status === 'released') {
          bg = 'bg-blue-950 border-blue-400 text-blue-100 ring-2 ring-blue-500 bay-glow-blue animate-pulse-ring';
          label = 'Select';
          icon = <span className="font-display font-extrabold text-base text-blue-300">P</span>;
        }
      }

      if (isB14 && isReservedCheckedIn) {
        bg = 'bg-blue-900 border-emerald-400 text-blue-100 ring-2 ring-emerald-500 bay-glow-emerald';
        label = 'Reassigned';
        icon = <div className="w-5 h-5 text-emerald-300"><Icon.Navigation /></div>;
      }

      const handleClick = () => {
        if (isB08 && (booking.status === 'none' || booking.status === 'released')) {
          dispatch({ type: 'CONFIRM_RESERVATION' });
        } else if (isGhost) {
          if (autoReleaseActive) {
            dispatch({
              type: 'SHOW_TOAST',
              message: `${bay.id}: Auto-freed after the 15-minute grace window.`,
              toastType: 'success',
              target: 'driver'
            });
          } else {
            dispatch({
              type: 'SHOW_TOAST',
              message: `${bay.id}: Unclaimed reservation without check-in.`,
              toastType: 'warning',
              target: 'driver'
            });
          }
        } else if (isOccupied || isSquatter) {
          dispatch({
            type: 'SHOW_TOAST',
            message: `${bay.id}: Occupied by parked vehicle.`,
            toastType: 'info',
            target: 'driver'
          });
        } else {
          dispatch({
            type: 'SHOW_TOAST',
            message: `${bay.id}: Available bay.`,
            toastType: 'success',
            target: 'driver'
          });
        }
      };

      // J2: Apply 30ms stagger delay ONLY while a lens sweep is actively running
      const staggerStyle = (sweeping && isGhost) ? { transitionDelay: `${index * 30}ms` } : undefined;

      return (
        <button
          type="button"
          onClick={handleClick}
          style={staggerStyle}
          className={`h-[72px] rounded-xl border-x border-t-2 border-b flex flex-col items-center justify-between py-1.5 px-0.5 tap-scale transition-all duration-300 select-none focus:outline-none focus:ring-2 focus:ring-brandBlue ${bg}`}
          aria-label={`Parking bay ${bay.id}, status: ${label}`}
        >
          <span className="font-display text-xs font-bold leading-none tabular-nums">{bay.id}</span>
          <div className="flex items-center justify-center my-auto">{icon}</div>
          <span className="text-xs font-semibold tracking-tight truncate max-w-full leading-none">{label}</span>
        </button>
      );
    }

    // =========================================================================

    // =========================================================================
    function ScreenS2ActiveBooking({ state, dispatch, formatMmSs }) {
      const { booking, nearZone } = state;
      const { secondsRemaining, extensionApplied, arrivalDeadline } = booking;

      // H4: Dynamic arrival deadline label updates to 9:25 AM when +10 min buffer is applied
      const deadlineLabel = extensionApplied ? '9:25 AM' : arrivalDeadline;

      const totalWindow = extensionApplied ? 1500 : 900;
      const radius = 76;
      const circumference = 2 * Math.PI * radius;
      const progress = Math.max(0, Math.min(1, secondsRemaining / totalWindow));
      const strokeOffset = circumference - (progress * circumference);

      let strokeColor = '#059669';
      if (secondsRemaining <= 120) strokeColor = '#E11D48';
      else if (secondsRemaining <= 300) strokeColor = '#D97706';

      return (
        <div className="space-y-4 animate-screen">
          
          <div className="bg-white rounded-3xl border border-borderSubtle shadow-raised p-5 flex flex-col items-center text-center stagger-1">

            </div>

            <div className="relative w-44 h-44 my-2 flex items-center justify-center">
              <svg className="w-full h-full -rotate-90" viewBox="0 0 176 176">
                <circle
                  cx="88"
                  cy="88"
                  r={radius}
                  className="stroke-slate-100"
                  strokeWidth="10"
                  fill="transparent"
                />
                <circle
                  cx="88"
                  cy="88"
                  r={radius}
                  stroke={strokeColor}
                  strokeWidth="10"
                  strokeDasharray={circumference}
                  strokeDashoffset={strokeOffset}
                  strokeLinecap="round"
                  fill="transparent"
                  className="transition-all duration-700 ease-out"
                />
              </svg>

              <div className="absolute inset-0 flex flex-col items-center justify-center">

                <div className="flex items-center gap-2">
